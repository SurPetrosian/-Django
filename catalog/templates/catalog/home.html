<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Свежий вкус</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh; /* Для закрепления футера */
        }

        .banner {
            background: url('https://i.pinimg.com/originals/b3/63/b9/b363b96563a12c16f854ee7d40a7c4da.jpg') no-repeat center center;
            background-size: cover;
            height: 300px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }

        .banner h1 {
            font-size: 3em;
        }

        .card img {
            height: 200px;
            object-fit: cover;
        }

        /* Анимация выпадающего меню */
        @keyframes dropdownFade {
            0% {
                opacity: 0;
                transform: translateY(-10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-dropdown {
            animation: dropdownFade 0.3s ease;
        }

        /* Закрепление футера */
        footer {
            margin-top: auto; /* Футер всегда внизу */
        }
    </style>
</head>
<body>

<!-- Навигация -->
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <!-- Меню категорий -->
        <div class="dropdown me-3">
            <button class="btn btn-light dropdown-toggle" type="button" id="categoryMenu" data-bs-toggle="dropdown" aria-expanded="false">
                Категории
            </button>
            <ul class="dropdown-menu animate-dropdown" aria-labelledby="categoryMenu">
                <li><a class="dropdown-item" href="#">Фрукты</a></li>
                <li><a class="dropdown-item" href="#">Молочные продукты</a></li>
                <li><a class="dropdown-item" href="#">Хлебобулочные изделия</a></li>
            </ul>
        </div>

        <!-- Бренд -->
        <a class="navbar-brand" href="#">Свежий вкус</a>

        <!-- Кнопка-бургер -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Ссылки -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="#">Главная</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Каталог</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Контакты</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Баннер -->
<div class="banner">
    <h1>Свежие продукты каждый день</h1>
</div>

<!-- Товары -->
<div class="container my-5">
    <h2 class="mb-4 text-center">Наши товары</h2>
    <div class="row g-4">
        <!-- Товар 1 -->
        <div class="col-md-4">
            <div class="card">
                <img src="https://zelenogradsk.com/upload/iblock/8de/c32i6hgvjxpbj6jsaq33rf63dckgksp8.jpg" class="card-img-top" alt="Яблоки">
                <div class="card-body">
                    <h5 class="card-title">Яблоки</h5>
                    <p class="card-text">Свежие красные яблоки, 1 кг</p>
                    <button class="btn btn-success" onclick="addToCart('Яблоки')">В корзину</button>
                </div>
            </div>
        </div>
        <!-- Товар 2 -->
        <div class="col-md-4">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1586201375761-83865001e17b" class="card-img-top" alt="Молоко">
                <div class="card-body">
                    <h5 class="card-title">Молоко</h5>
                    <p class="card-text">Натуральное молоко, 1 литр</p>
                    <button class="btn btn-success" onclick="addToCart('Молоко')">В корзину</button>
                </div>
            </div>
        </div>
        <!-- Товар 3 -->
        <div class="col-md-4">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1615484477799-6c03c7c09f87" class="card-img-top" alt="Хлеб">
                <div class="card-body">
                    <h5 class="card-title">Хлеб</h5>
                    <p class="card-text">Домашний пшеничный хлеб</p>
                    <button class="btn btn-success" onclick="addToCart('Хлеб')">В корзину</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="bg-light text-center py-3">
    <p class="mb-0">© 2025 Свежий вкус. Все права защищены.</p>
</footer>

<!-- JS -->
<script>
    function addToCart(productName) {
        alert(productName + " добавлен в корзину!");
    }
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
