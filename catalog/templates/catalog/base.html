<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Свежий вкус{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .banner {
            background: url('https://i.pinimg.com/originals/b3/63/b9/b363b96563a12c16f854ee7d40a7c4da.jpg') no-repeat center center;
            background-size: cover;
            height: 300px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }
        .banner h1 {
            font-size: 3em;
        }
        .card img {
            height: 200px;
            object-fit: cover;
        }
        @keyframes dropdownFade {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-dropdown {
            animation: dropdownFade 0.3s ease;
        }
        footer {
            margin-top: auto;
        }
    </style>
</head>

<body>
    {% include 'catalog/header.html' %}

    <div class="container my-5">
        {% block content %}
        {% endblock %}
    </div>

    {% include 'catalog/footer.html' %}

    <!-- JS -->
    <script>
        function addToCart(productName) {
            alert(productName + " добавлен в корзину!");
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
