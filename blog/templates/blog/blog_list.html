{% extends 'blog/base.html' %}

{% block content %}
  <h1>Блог</h1>

  <a href="{% url 'blog:create' %}" class="btn btn-primary">➕ Создать статью</a>

  <div class="blog-list mt-4">
    {% for blog in blogs %}
      <div class="blog-card mb-4">
        <h2 class="blog-card-title">
          <a href="{% url 'blog:detail' blog.pk %}">{{ blog.header }}</a>
        </h2>
        <p class="text-muted">Дата: {{ blog.created_at }}</p>
      </div>
    {% endfor %}
  </div>
{% endblock %}
